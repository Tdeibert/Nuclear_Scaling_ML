flow: vulcan_25_refactor
version: 1
description: Refactor of the vulcan_2.5 training pipeline

imports: |
  # libraries every step can use
  import numpy as np

params:
  # config the pipeline reads but does not compute
  input_path: data/input.csv

nodes:

  [
    {id: Config, title: "Pipeline and Exp Config", produces: {pipe_cfg: {}, exp_cfg: {}}, stub: "", consumes: [dataclass, os, sys, roifile, cv2]},
    {
        id: Required_Packages,
        title: Required Packages,
        produces: {dataclass: {type: package}, Path: {type: package}, os: {}, math: {}, time: {}, gc: {}, sys: {}, JSON: {}, hashlib: {}, futures: {}, ProcessPoolExecutor: {}, as_completed: {}, multiproccessing: {}, numpy: {}, pandas: {}, tiff: {}, plt: {}, ListedColormap: {}, ndimage: {}, filters: {}, morphology: {}, measure: {}, segmentation: {}, skdraw: {}, h_maxima: {}, peak_local_max: {}, DBSCAN: {}, TF: {}, layers: {}, models: {}, watershed: {}, _disk: {}, distance_transform_edt: {type: function}, affine_transform: {}, gaussian_filter: {}, roifile: {}, cv2: {}},
        stub: "Required_Packages = packages...

          from dataclasses import dataclas, field

          from pathlib import Path

          import os, math, time, gc, sys, json, hashlib

          from concurrent,futures\ 

          import processPoolExecutor, as_completed

          import multiprocessing

          import numpy

          import pandas

          import tifffile as tiff

          import matplotlib as plt

          from matplotlib.colors import ListedColormap

          from scipy import ndimage

          frim skimage import filters, morphology, measure, segmentation, draw as skdraw

          from skimage.morphology import h_maxima

          from skimage.feature import peak_local_max

          from sklearn.cluster import DBSCAN

          from skimage.segmentation import watershed

          from skimage.morphology import disk as _disk

          from sciy.ndimage import distance_transform_edt, affine_transform, gaussian_filter

          import roifile

          import cv2


          import tensorflow as tf

          from tensorflow.keras import layers, models


          print(\"TensorFlow      :\", tf.__version__)

          print(\"Num GPUs        :\", len(tf.config.list_physical_devices(\"GPU\")))

          print(\"CPU count       :\", os.cpu_count())"
      },
    {id: Loading, title: Loading, produces: {nd_array_memmap_image: {}, fiji_rois: {}, data_csvs: {}}, stub: ''''''' This cell is responsible for all loading conditions. It will load images, path objects, rois. This cell should consume cfg objects and output either a nd array, data frame or roi set''''''', consumes: [pipe_cfg, exp_cfg, Path, JSON, numpy, pandas, tiff]},
    {id: Patch_Extraction, title: Patch Extraction, produces: {training_patches: {}}, stub: "", consumes: [pipe_cfg, exp_cfg, nd_array_memmap_image, fiji_rois, data_csvs, image_features_out]},
    {id: Model_Training, title: Model Training, produces: {vulcan_model_number: {}, hist: {}}, stub: "vulcan_model_number\nhist\n", consumes: [training_patches]},
    {id: image_features, title: image features, produces: {image_features_out: {}}, stub: "''' this section will determine the functions required for feature extraction from the images for training patch extraction'''", consumes: [pipe_cfg, exp_cfg, nd_array_memmap_image, filters, morphology, measure, segmentation, skdraw, h_maxima, peak_local_max, DBSCAN, watershed, _disk, distance_transform_edt, affine_transform, gaussian_filter, ndimage, numpy, pandas, tiff]},
    {id: training_history, title: training history, produces: {training_history_out: {}, history_plots: {}}, stub: "history_plots", consumes: [hist]}
  ]
outputs:
  - vulcan_model_number
